version: 2

models:
  - name: stg_orders
    description: Typed orders. Status is lowercased. Timestamps that do not parse become null.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [created, approved, processing, invoiced, shipped, delivered, unavailable, canceled]
  - name: stg_customers
    description: Customers with zip prefixes padded to 5 digits so they join the geolocation table.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: stg_order_items
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: stg_holidays
    description: One row per Brazilian federal public holiday in 2016-2018.
    columns:
      - name: holiday_date
        tests: [unique, not_null]

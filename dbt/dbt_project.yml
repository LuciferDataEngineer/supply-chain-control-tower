name: supply_chain
version: "1.0.0"
config-version: 2
profile: supply_chain

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

quoting:
  database: false
  schema: false
  identifier: false

models:
  supply_chain:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
